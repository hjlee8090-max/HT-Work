<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticket Pilot — 보드</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --line: #dfe1e6; --text: #172b4d; --sub: #6b778c;
    --body-text: #344563;
    --draft: #8993a4; --approved: #0065ff; --progress: #ff991f; --done: #36b37e;
    --danger: #de350b; --accent: #0052cc; --save: #00875a;
    --pastel-draft: #f5f5f9; --pastel-approved: #eaf2ff; --pastel-progress: #fff6e8;
    --pastel-done: #eafaf1; --pastel-rejected: #fdecec;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Pretendard", "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "맑은 고딕", sans-serif; background: #ffffff; color: var(--text); font-size: 14px; line-height: 1.5; }
  .notice { background: #fffae6; border-bottom: 1px solid #ffe380; padding: 8px 16px; font-size: 12.5px; color: #172b4d; }
  header { background: #fff; border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  header h1 { font-size: 17px; }
  header .goal { color: var(--sub); font-size: 13px; flex: 1; min-width: 200px; }
  header .meta { color: var(--sub); font-size: 12px; }
  header .conn { font-size: 12px; color: var(--save); font-weight: 700; }
  .tabs { display: flex; gap: 4px; background: #fff; border-bottom: 1px solid var(--line); padding: 0 16px; }
  .tabs button { border: none; background: none; padding: 11px 12px; margin-bottom: -1px; border-bottom: 2px solid transparent; cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--sub); }
  .tabs button:hover { color: var(--text); }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .actions { display: flex; gap: 8px; }
  .actions button { border: none; border-radius: 4px; padding: 8px 14px; cursor: pointer; font-size: 13px; font-weight: 600; }
  #btn-apply { background: var(--accent); color: #fff; }
  #btn-connect { background: #e6effc; color: var(--accent); display: none; }
  #btn-save { background: var(--save); color: #fff; display: none; }
  #apply-msg { display: none; background: #e3fcef; border-bottom: 1px solid #79f2c0; padding: 10px 16px; font-size: 13px; }
  #apply-msg textarea { width: 100%; height: 90px; margin-top: 8px; font-family: monospace; font-size: 11px; display: none; }
  .msg-btns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .msg-btns button { border: 1px solid var(--line); background: #fff; border-radius: 4px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; }
  .msg-btns button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { padding: 16px; }

  /* ---- 보드 / 컬럼 ---- */
  .board { display: grid; grid-template-columns: repeat(4, minmax(260px, 1fr)); gap: 16px; align-items: start; }
  .col { background: transparent; border-radius: 8px; padding: 0 12px; }
  .col:not(:last-child) { border-right: 1px solid #eee; }
  .col h2 { font-size: 14px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; padding-top: 12px; }
  .col h2 .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .col h2 .col-title { flex: 1; }
  .col h2 .cnt { background: #f4f5f7; border-radius: 10px; padding: 1px 8px; font-size: 12px; font-weight: 600; color: var(--sub); }

  /* 섹션(컬럼) 단위 독립 스크롤 — 스크롤바는 호버 시에만 노출 */
  .col-body { display: flex; flex-direction: column; max-height: calc(100vh - 230px); overflow-y: auto; padding: 2px 6px 12px 2px; scrollbar-width: none; }
  .col-body:hover { scrollbar-width: thin; scrollbar-color: rgba(9,30,66,.25) transparent; }
  .col-body::-webkit-scrollbar { width: 6px; }
  .col-body::-webkit-scrollbar-track { background: transparent; }
  .col-body::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px; }
  .col-body:hover::-webkit-scrollbar-thumb { background: rgba(9,30,66,.28); }
  .col-body.drag-over { outline: 2px dashed rgba(9,30,66,.18); outline-offset: -6px; border-radius: 8px; background: rgba(9,30,66,.025); }

  /* ---- 카드 ---- */
  .card { background: var(--card); border-radius: 8px; border: 1px solid rgba(9,30,66,.04); padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(9,30,66,.1), 0 2px 6px rgba(9,30,66,.08); cursor: pointer; }
  .card.status-draft { background: var(--pastel-draft); }
  .card.status-approved { background: var(--pastel-approved); }
  .card.status-in_progress { background: var(--pastel-progress); }
  .card.status-blocked { background: var(--pastel-progress); }
  .card.status-done { background: var(--pastel-done); }
  .card.status-rejected { background: var(--pastel-rejected); }
  .card.changed { border-left: 4px solid var(--progress); }
  .card.draggable { cursor: grab; }
  .card.dragging { opacity: .45; cursor: grabbing; }
  .card.status-rejected h3 { text-decoration: line-through; color: var(--sub); }

  .id { font-size: 11px; color: var(--sub); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .badge { border-radius: 3px; padding: 1px 6px; font-size: 10.5px; font-weight: 700; color: #fff; white-space: nowrap; }
  .badge.b-suggested { background: #6554c0; }
  .badge.b-rejected { background: var(--danger); }
  .badge.b-blocked { background: var(--progress); }
  .badge.b-prio { background: #42526e; }
  .badge.b-comment { background: var(--save); }
  .badge.b-flex { background: #00a3bf; }
  .badge.b-rework { background: #bf2600; }
  .card h3 { font-size: 15.5px; font-weight: 700; line-height: 1.35; margin: 8px 0 6px; }
  .card .purpose { font-size: 13px; color: var(--body-text); line-height: 1.5; margin: 0 0 8px; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .step-count { font-size: 12px; color: var(--sub); margin-bottom: 8px; }
  .deps { font-size: 11px; color: var(--sub); margin-bottom: 4px; }
  .deps .dep-chip { display: inline-block; background: rgba(9,30,66,.04); border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px; margin-right: 4px; }
  .readonly { font-size: 11.5px; color: var(--sub); margin-top: 4px; }

  /* ---- 상세/편집 모달 — 좌: 티켓 내용 · 우: 요청·코멘트 패널 ---- */
  #modal-root { display: none; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(9,30,66,.5); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 1000; }
  .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 1020px; max-height: 86vh; overflow-y: auto; padding: 24px; box-shadow: 0 12px 32px rgba(9,30,66,.28); }
  .modal-body { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 0 28px; align-items: start; }
  .modal-main { min-width: 0; }
  .modal-side { border-left: 1px solid var(--line); padding-left: 24px; position: sticky; top: 0; max-height: calc(86vh - 96px); overflow-y: auto; }
  .modal-side .modal-label:first-child { margin-top: 4px; }
  @media (max-width: 920px) {
    .modal { max-width: 560px; }
    .modal-body { grid-template-columns: 1fr; }
    .modal-side { border-left: none; padding-left: 0; border-top: 1px solid var(--line); margin-top: 16px; padding-top: 4px; position: static; max-height: none; }
  }
  .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .modal-close { border: none; background: #f4f5f7; width: 28px; height: 28px; min-width: 28px; border-radius: 50%; cursor: pointer; font-size: 13px; color: var(--sub); }
  .modal-title { font-size: 18px; font-weight: 700; margin: 12px 0 14px; line-height: 1.4; }
  .modal-label { font-size: 11px; font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: .03em; margin: 16px 0 6px; }
  .modal-purpose { font-size: 14px; color: var(--body-text); line-height: 1.6; white-space: pre-wrap; }
  .purpose-source { font-size: 11px; color: var(--sub); font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; margin-top: 4px; }
  .modal-steps { padding-left: 20px; }
  .modal-steps li { margin-bottom: 8px; line-height: 1.55; font-size: 13.5px; }
  .modal-meta { font-size: 12.5px; color: var(--sub); margin-bottom: 4px; }

  /* ---- 코멘트 (모달 우측 패널) — 길게 쓰는 요청을 전제로 넓게 잡는다 ---- */
  .comments { display: grid; gap: 8px; }
  .comment { background: #f8f9fa; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
  .comment-text { font-size: 13.5px; color: var(--body-text); line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .comment-meta { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 11px; color: var(--sub); }
  .comment-meta button { border: none; background: none; color: var(--danger); font-size: 11px; cursor: pointer; padding: 0; }
  .comment-empty { font-size: 12.5px; color: var(--sub); line-height: 1.6; }
  .comment-form { display: grid; gap: 8px; margin-top: 10px; }
  .comment-form textarea { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-size: 13.5px; font-family: inherit; line-height: 1.6; min-height: 260px; resize: vertical; }
  .comment-form button { border: 1px solid #b3d4ff; background: #fff; border-radius: 6px; padding: 8px 12px; font-size: 13px; cursor: pointer; color: var(--accent); font-weight: 600; }

  /* ---- 편집 폼 (모달 내부) ---- */
  .edit-form { display: grid; gap: 10px; margin-top: 4px; }
  .edit-form label { font-size: 11px; font-weight: 600; color: var(--sub); }
  .edit-form input, .edit-form textarea { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 13px; font-family: inherit; }
  .edit-form textarea { min-height: 90px; }
  .edit-form .err { color: var(--danger); font-size: 11.5px; display: none; }

  /* ---- 버튼 묶음 — 모달 하단 전체 폭 푸터, 우측 정렬 (주 액션이 제일 우측) ---- */
  .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .btns button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 8px 18px; font-size: 13px; cursor: pointer; }
  .btns .b-approve { background: var(--approved); border-color: var(--approved); color: #fff; font-weight: 600; }
  .btns .b-reject { color: var(--danger); border-color: #ffbdad; }

  /* ---- 리포트 탭 — 완료 보고서 ----
     표는 훑어보기용 "완료 목록"으로만 쓴다 (table-layout:fixed — 긴 파일 경로가 열 너비를 밀어
     다른 열을 한 글자 폭으로 짜부라뜨리던 문제를 막는다). 본문은 티켓별 카드로 풀어
     사유 → 목적 → 한 일 → 효과 → 바뀐 파일 → 증빙 → 후속 순서로 읽게 한다. */
  #report { display: none; }
  .rp { max-width: 1060px; margin: 0 auto; }
  .rp-head { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; margin-bottom: 20px; }
  .rp-head-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .rp-title { font-size: 19px; font-weight: 700; line-height: 1.4; }
  .rp-goal { font-size: 13.5px; color: var(--sub); line-height: 1.65; margin-top: 6px; max-width: 68ch; }
  .rp-print { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 7px 13px; font-size: 12.5px; color: var(--body-text); cursor: pointer; white-space: nowrap; }
  .rp-stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .rp-stat { flex: 1 1 110px; background: #f7f8fa; border-radius: 8px; padding: 10px 12px; }
  .rp-stat b { display: block; font-size: 21px; font-weight: 700; line-height: 1.25; }
  .rp-stat span { font-size: 11.5px; color: var(--sub); }
  .rp-stat.s-done b { color: var(--done); }
  .rp-stat.s-run b { color: var(--progress); }
  .rp-stat.s-wait b { color: var(--approved); }
  .rp-stat.s-rej b { color: var(--danger); }
  .rp-bar { height: 6px; border-radius: 3px; background: #ebecf0; margin-top: 14px; overflow: hidden; }
  .rp-bar i { display: block; height: 100%; background: var(--done); border-radius: 3px; }
  .rp-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; font-size: 12.5px; color: var(--sub); }

  .rp-sec { margin-bottom: 22px; }
  .rp-sec-h { font-size: 12px; font-weight: 700; color: var(--sub); letter-spacing: .04em; margin-bottom: 8px; }
  .rp-index-wrap { background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
  .rp-index { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 520px; }
  .rp-index th, .rp-index td { text-align: left; padding: 9px 12px; font-size: 12.5px; border-bottom: 1px solid var(--line); }
  .rp-index th { background: #f7f8fa; color: var(--sub); font-size: 11px; font-weight: 700; letter-spacing: .03em; }
  .rp-index tr:last-child td { border-bottom: none; }
  .rp-index tbody tr { cursor: pointer; }
  .rp-index tbody tr:hover { background: #f7f9fd; }
  .rp-index .c-id { width: 74px; color: var(--sub); }
  .rp-index .c-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-weight: 600; }
  .rp-index .c-date { width: 100px; color: var(--sub); }
  .rp-index .c-num { width: 78px; color: var(--sub); text-align: right; }

  /* ---- 티켓별 완료 카드 ---- */
  .rp-card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px 22px; margin-bottom: 14px; }
  .rp-card.hl { box-shadow: 0 0 0 2px rgba(0, 82, 204, .35); }
  .rp-card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11px; color: var(--sub); }
  .rp-card-date { margin-left: auto; white-space: nowrap; }
  .rp-card-title { font-size: 17px; font-weight: 700; line-height: 1.45; margin: 9px 0 2px; }
  .rp-k { font-size: 11px; font-weight: 700; color: var(--sub); letter-spacing: .04em; margin: 17px 0 6px; }
  .rp-v { font-size: 14px; line-height: 1.75; color: var(--body-text); max-width: 70ch; overflow-wrap: anywhere; white-space: pre-wrap; }
  .rp-v.lead { color: var(--text); font-weight: 600; }
  .rp-files { display: flex; flex-wrap: wrap; gap: 6px; }
  .rp-path { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12px; line-height: 1.5; background: #f4f5f7; border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; color: var(--body-text); overflow-wrap: anywhere; }
  .rp-ev { display: grid; gap: 10px; }
  .rp-shots { display: flex; flex-wrap: wrap; gap: 12px; }
  .rp-shot { width: 210px; max-width: 100%; }
  .rp-shot img { width: 100%; height: 130px; object-fit: contain; background: #f4f5f7; border: 1px solid var(--line); border-radius: 6px; display: block; }
  .rp-shot figcaption { font-size: 11.5px; color: var(--sub); line-height: 1.55; margin-top: 5px; overflow-wrap: anywhere; }
  .rp-ev-row { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; align-items: start; }
  .rp-tag { font-size: 10px; font-weight: 700; color: #fff; background: #42526e; border-radius: 3px; padding: 3px 0; text-align: center; letter-spacing: .02em; }
  .rp-tag.t-diff { background: #6554c0; }
  .rp-tag.t-file { background: #00a3bf; }
  .rp-ev-note { font-size: 13px; line-height: 1.7; color: var(--body-text); max-width: 68ch; overflow-wrap: anywhere; }
  .rp-ev-path { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 11.5px; color: var(--sub); margin-top: 3px; overflow-wrap: anywhere; }
  .rp-list { padding-left: 18px; max-width: 70ch; }
  .rp-list li { font-size: 13.5px; line-height: 1.75; color: var(--body-text); margin-bottom: 5px; overflow-wrap: anywhere; }
  .rp-chip { display: inline-block; background: rgba(9, 30, 66, .04); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; font-size: 12px; color: var(--body-text); }
  .rp-note { font-size: 12.5px; color: var(--sub); line-height: 1.7; }
  .rp-empty { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 36px 24px; text-align: center; color: var(--sub); font-size: 13.5px; line-height: 1.9; }

  @media (max-width: 900px) { .board { grid-template-columns: repeat(2, minmax(240px, 1fr)); } .col-body { max-height: none; } }
  @media (max-width: 560px) { .board { grid-template-columns: 1fr; } .rp-head, .rp-card { padding: 16px; } .rp-shot { width: 100%; } }

  /* 인쇄·PDF 저장 — 보고용으로 뽑을 때 보드 UI 껍데기는 빼고 리포트만 남긴다 */
  @media print {
    .notice, header, .tabs, #apply-msg, #modal-root, .rp-print { display: none !important; }
    body { background: #fff; }
    main { padding: 0; }
    .rp { max-width: none; }
    .rp-head, .rp-card, .rp-index-wrap { break-inside: avoid; page-break-inside: avoid; }
  }

</style>
</head>
<body>
<div class="notice">⚠️ 이 파일은 tickets.json에서 생성된 뷰입니다. 크롬·엣지는 <b>[tickets.json 연결]</b> 후 <b>[저장]</b>을 누르면 변경(승인·반려·편집·코멘트)이 tickets.json에 바로 저장되고, 보드를 다시 열 때 그 상태가 그대로 보입니다. 다른 브라우저는 <b>[프롬프트 복사(코워크)]</b>로 복사해 클로드 채팅에 붙여넣으세요. 진행중·완료·보류 카드는 읽기 전용입니다.</div>
<header>
  <h1>Ticket Pilot</h1>
  <span class="goal" id="h-goal"></span>
  <span class="conn" id="conn-status"></span>
  <span class="meta" id="h-meta"></span>
  <div class="actions">
    <button id="btn-connect">tickets.json 연결</button>
    <button id="btn-save">저장</button>
    <button id="btn-apply">프롬프트 복사(코워크)</button>
  </div>
</header>
<nav class="tabs">
  <button id="tab-board" class="active">보드</button>
  <button id="tab-report">리포트</button>
</nav>
<div id="apply-msg"></div>
<main>
  <div class="board" id="board"></div>
  <div id="report"></div>
</main>
<div id="modal-root"></div>

<script id="tickets-data" type="application/json">{"schema_version":4,"project":{"name":"(템플릿)","goal":"ticket-create 스킬이 이 영역을 tickets.json 전문으로 교체한다"},"updated_at":"","tickets":[]}</script>

<script>
"use strict";
/* Ticket Pilot 보드 — 바닐라 JS 단일 파일. 외부 네트워크 요청 없음. */

/* schema_version 1~3(comments·scope·latitude·rework_of 없음) 데이터도 그대로 열리도록 로드 시 보정한다. */
function normalizeDoc(doc) {
  doc.schema_version = 4;
  (doc.tickets || []).forEach(t => {
    if (!Array.isArray(t.comments)) t.comments = [];
    if (!Array.isArray(t.scope)) t.scope = [];
    if (t.latitude !== "flex") t.latitude = "strict";
    if (typeof t.rework_of !== "string" || !t.rework_of.trim()) t.rework_of = null;
  });
  return doc;
}

/* 상태 한글 표기 (수정 이력 칩에 사용) */
const STATUS_KO = { draft: "초안", approved: "승인", in_progress: "진행중", blocked: "보류", done: "완료", rejected: "반려" };

let DOC = normalizeDoc(JSON.parse(document.getElementById("tickets-data").textContent));
let ORIGINAL = null;
let origById = {};
function rebuildBaseline() {
  ORIGINAL = JSON.parse(JSON.stringify(DOC));
  origById = {};
  ORIGINAL.tickets.forEach(t => { origById[t.id] = t; });
}
rebuildBaseline();

/* 보드에서 허용되는 상태 전환: draft ↔ approved ↔ rejected 뿐.
   in_progress · done · blocked 는 읽기 전용 (실행 상태는 에이전트만 쓴다). */
const EDITABLE = ["draft", "approved", "rejected"];
/* dropStatus: 드래그로 카드를 이 컬럼에 놓았을 때 적용할 상태. null이면 드롭 불가(읽기 전용 컬럼). */
const COLUMNS = [
  { title: "초안",   statuses: ["draft", "rejected"], dropStatus: "draft",    dot: "var(--draft)" },
  { title: "승인",   statuses: ["approved"],           dropStatus: "approved", dot: "var(--approved)" },
  { title: "진행중", statuses: ["in_progress", "blocked"], dropStatus: null,   dot: "var(--progress)" },
  { title: "완료",   statuses: ["done"],               dropStatus: null,      dot: "var(--done)" },
];

let openModalId = null;   // 상세/편집 모달에 열려 있는 티켓 id (null = 닫힘)
let modalEditing = false; // 모달이 편집 모드인지
let draggedId = null;     // 현재 드래그 중인 티켓 id
let dragMoved = false;    // 드래그 직후 click 이벤트를 무시하기 위한 플래그

function isChanged(t) {
  const o = origById[t.id];
  return !o || JSON.stringify(o) !== JSON.stringify(t);
}

function nowISO() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const off = -d.getTimezoneOffset(), sign = off >= 0 ? "+" : "-", a = Math.abs(off);
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
    "T" + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds()) +
    sign + p(Math.floor(a / 60)) + ":" + p(a % 60);
}

function el(tag, attrs, ...children) {
  const n = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === "class") n.className = attrs[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  for (const c of children) {
    if (c == null) continue;
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return n;
}

function setStatus(id, status) {
  const t = DOC.tickets.find(x => x.id === id);
  if (!t || !EDITABLE.includes(origById[id] ? origById[id].status : t.status)) return;
  t.status = status;
  render();
}

/* 드래그로 놓았을 때 그 전환이 허용되는지 — 기존 버튼(승인/초안으로) 규칙과 동일하게 판정 */
function canDrop(t, dropStatus) {
  if (!dropStatus) return false;
  const origStatus = origById[t.id] ? origById[t.id].status : t.status;
  if (!EDITABLE.includes(origStatus)) return false;
  if (dropStatus === t.status) return false;
  if (dropStatus === "draft") return true;                 // approved·rejected → draft ("초안으로") 와 동일
  if (dropStatus === "approved") return t.status === "draft"; // draft → approved ("승인") 와 동일
  return false;
}

function attachDrag(cardEl, t) {
  const origStatus = origById[t.id] ? origById[t.id].status : t.status;
  if (!EDITABLE.includes(origStatus)) return; // 읽기 전용 티켓은 드래그 불가
  cardEl.classList.add("draggable");
  cardEl.draggable = true;
  cardEl.addEventListener("dragstart", (e) => {
    draggedId = t.id;
    dragMoved = true;
    cardEl.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", t.id); } catch (err) { /* 일부 환경 제약 무시 */ }
  });
  cardEl.addEventListener("dragend", () => {
    cardEl.classList.remove("dragging");
    draggedId = null;
    setTimeout(() => { dragMoved = false; }, 0);
  });
}

function attachDropZone(bodyEl, dropStatus) {
  if (!dropStatus) return; // 진행중·완료 컬럼은 드롭 대상이 아니다
  bodyEl.addEventListener("dragover", (e) => {
    const t = DOC.tickets.find(x => x.id === draggedId);
    if (!t || !canDrop(t, dropStatus)) return;
    e.preventDefault();
    bodyEl.classList.add("drag-over");
  });
  bodyEl.addEventListener("dragleave", (e) => {
    if (e.target === bodyEl) bodyEl.classList.remove("drag-over");
  });
  bodyEl.addEventListener("drop", (e) => {
    e.preventDefault();
    bodyEl.classList.remove("drag-over");
    const id = draggedId || e.dataTransfer.getData("text/plain");
    const t = DOC.tickets.find(x => x.id === id);
    if (!t || !canDrop(t, dropStatus)) return;
    t.status = dropStatus;
    render();
  });
}

/* purpose 필드가 "[출처 태그](선택)\n사유: ..\n목적: ..\n효과: .." 컨벤션을 따르면 분해해서 반환.
   형식이 아니면 null — 이 경우 호출부는 원문 그대로 표시한다 (구형 티켓 하위 호환). */
function parsePurpose(text) {
  if (!text) return null;
  const lines = text.split("\n").map(s => s.trim()).filter(Boolean);
  let idx = 0;
  let sourceTag = null;
  if (lines[idx] && /^\[.+\]$/.test(lines[idx])) { sourceTag = lines[idx]; idx++; }
  const order = ["사유", "목적", "효과"];
  const out = {};
  for (const key of order) {
    const line = lines[idx];
    if (!line || !line.startsWith(key + ":")) return null;
    out[key] = line.slice(key.length + 1).trim();
    idx++;
  }
  if (idx !== lines.length) return null; // 형식 외 잔여 줄이 있으면 컨벤션 미준수로 취급
  out.sourceTag = sourceTag;
  return out;
}

function renderIdRow(t) {
  const idRow = el("div", { class: "id" }, t.id);
  idRow.appendChild(el("span", { class: "badge b-prio" }, "P" + t.priority));
  if (t.origin === "suggested") idRow.appendChild(el("span", { class: "badge b-suggested" }, "제안"));
  if (t.status === "rejected") idRow.appendChild(el("span", { class: "badge b-rejected" }, "반려"));
  if (t.status === "blocked") idRow.appendChild(el("span", { class: "badge b-blocked" }, "보류"));
  if ((t.comments || []).length) idRow.appendChild(el("span", { class: "badge b-comment" }, "💬 " + t.comments.length));
  if (t.latitude === "flex") idRow.appendChild(el("span", { class: "badge b-flex" }, "재량"));
  if (t.rework_of) idRow.appendChild(el("span", { class: "badge b-rework" }, "↩ " + t.rework_of));
  if (isChanged(t)) idRow.appendChild(el("span", {}, "● 변경됨"));
  return idRow;
}

/* ---- 카드 (컬럼 안, 요약만) ---- */
function renderCard(t) {
  const origStatus = origById[t.id] ? origById[t.id].status : t.status;
  const readonly = !EDITABLE.includes(origStatus);
  const card = el("div", { class: "card status-" + t.status + (isChanged(t) ? " changed" : "") });

  card.appendChild(renderIdRow(t));
  card.appendChild(el("h3", {}, t.title));
  const parsedPurpose = parsePurpose(t.purpose);
  card.appendChild(el("div", { class: "purpose" }, parsedPurpose ? parsedPurpose["목적"] : (t.purpose || "")));
  card.appendChild(el("div", { class: "step-count" }, "단계 " + (t.steps || []).length + "개"));

  if (t.depends_on && t.depends_on.length) {
    const deps = el("div", { class: "deps" }, "의존: ");
    t.depends_on.forEach(id => deps.appendChild(el("span", { class: "dep-chip" }, id)));
    card.appendChild(deps);
  }

  if (readonly) card.appendChild(el("div", { class: "readonly" }, "읽기 전용"));

  card.addEventListener("click", () => {
    if (dragMoved) return; // 드래그 직후 발생하는 click은 모달을 열지 않는다
    openModalId = t.id;
    modalEditing = false;
    render();
  });

  attachDrag(card, t);
  return card;
}

function renderBoard() {
  const board = document.getElementById("board");
  board.innerHTML = "";
  for (const col of COLUMNS) {
    const items = DOC.tickets
      .filter(t => col.statuses.includes(t.status))
      .sort((a, b) => (a.priority - b.priority) || a.id.localeCompare(b.id));
    const c = el("div", { class: "col" });
    const h = el("h2", {});
    h.appendChild(el("span", { class: "dot", style: "background:" + col.dot }));
    h.appendChild(el("span", { class: "col-title", style: "color:" + col.dot }, col.title));
    h.appendChild(el("span", { class: "cnt" }, String(items.length)));
    c.appendChild(h);
    const body = el("div", { class: "col-body" });
    items.forEach(t => body.appendChild(renderCard(t)));
    c.appendChild(body);
    attachDropZone(body, col.dropStatus);
    board.appendChild(c);
  }
}

/* ---- 상세/편집 모달 ---- */
function closeModal() {
  openModalId = null;
  modalEditing = false;
  render();
}

/* 코멘트 절 — 모든 상태에서 표시하고, 편집 가능 티켓(draft·approved·rejected)에서만 추가·삭제를 허용한다.
   코멘트는 사용자가 티켓에 남기는 요청·지시로, 실행(ticket-run) 시 에이전트가 반영한다. */
function renderComments(wrap, t, readonly) {
  const list = t.comments || [];
  wrap.appendChild(el("div", { class: "modal-label" }, "요청·코멘트" + (list.length ? " (" + list.length + ")" : "")));
  const box = el("div", { class: "comments" });
  if (!list.length) box.appendChild(el("div", { class: "comment-empty" }, "남긴 코멘트가 없습니다. 실행 시 참고할 요청을 남겨 두면 에이전트가 반영합니다."));
  list.forEach((c, i) => {
    const row = el("div", { class: "comment" });
    row.appendChild(el("div", { class: "comment-text" }, c.text || ""));
    const meta = el("div", { class: "comment-meta" }, (c.at || "").slice(0, 16).replace("T", " "));
    if (!readonly) meta.appendChild(el("button", { onclick: () => { t.comments.splice(i, 1); render(); } }, "삭제"));
    row.appendChild(meta);
    box.appendChild(row);
  });
  wrap.appendChild(box);
  if (!readonly) {
    const form = el("div", { class: "comment-form" });
    const ta = el("textarea", { placeholder: "예: 이거 할 때 docs/스타일가이드.md 참고해서 진행해줘.\n여러 줄로 길게 적어도 됩니다 — 실행 시 그대로 반영됩니다." });
    form.appendChild(ta);
    form.appendChild(el("button", { onclick: () => {
      const v = ta.value.trim();
      if (!v) return;
      if (!Array.isArray(t.comments)) t.comments = [];
      t.comments.push({ at: nowISO(), text: v });
      render();
    } }, "코멘트 남기기"));
    wrap.appendChild(form);
  }
}

function renderModalView(t) {
  const wrap = el("div", {});
  const head = el("div", { class: "modal-head" });
  head.appendChild(renderIdRow(t));
  head.appendChild(el("button", { class: "modal-close", onclick: closeModal }, "✕"));
  wrap.appendChild(head);

  /* 좌(main): 티켓 내용 · 우(side): 요청·코멘트 패널 */
  const body = el("div", { class: "modal-body" });
  const main = el("div", { class: "modal-main" });

  main.appendChild(el("h3", { class: "modal-title" }, t.title));

  const parsedPurpose = parsePurpose(t.purpose);
  if (parsedPurpose) {
    if (parsedPurpose.sourceTag) main.appendChild(el("div", { class: "purpose-source" }, parsedPurpose.sourceTag));
    main.appendChild(el("div", { class: "modal-label" }, "사유"));
    main.appendChild(el("div", { class: "modal-purpose" }, parsedPurpose["사유"]));
    main.appendChild(el("div", { class: "modal-label" }, "목적"));
    main.appendChild(el("div", { class: "modal-purpose" }, parsedPurpose["목적"]));
    main.appendChild(el("div", { class: "modal-label" }, "효과"));
    main.appendChild(el("div", { class: "modal-purpose" }, parsedPurpose["효과"]));
  } else {
    main.appendChild(el("div", { class: "modal-label" }, "목적"));
    main.appendChild(el("div", { class: "modal-purpose" }, t.purpose || "(없음)"));
  }

  main.appendChild(el("div", { class: "modal-label" }, "단계 " + (t.steps || []).length + "개"));
  const ol = el("ol", { class: "modal-steps" });
  (t.steps || []).forEach(s => ol.appendChild(el("li", {}, s)));
  main.appendChild(ol);

  if (t.depends_on && t.depends_on.length) {
    main.appendChild(el("div", { class: "modal-label" }, "의존"));
    const deps = el("div", { class: "deps" });
    t.depends_on.forEach(id => deps.appendChild(el("span", { class: "dep-chip" }, id)));
    main.appendChild(deps);
  }

  main.appendChild(el("div", { class: "modal-label" }, "수정 범위 (scope)"));
  if (t.scope && t.scope.length) {
    const sc = el("div", { class: "deps" });
    t.scope.forEach(pth => sc.appendChild(el("span", { class: "dep-chip" }, pth)));
    main.appendChild(sc);
  } else {
    main.appendChild(el("div", { class: "modal-meta" }, "(미지정 — 병렬 실행 대상에서 제외, 직렬로만 실행)"));
  }
  main.appendChild(el("div", { class: "modal-label" }, "재량"));
  main.appendChild(el("div", { class: "modal-meta" }, t.latitude === "flex"
    ? "유연 — 범위 안에서 목적에 부합하는 부수 개선 허용 (내역은 결과에 구분 보고)"
    : "엄격(기본) — 단계에 적힌 것만 수행, 발견 사항은 보고만"));

  if (t.rework_of) {
    const orig = DOC.tickets.find(x => x.id === t.rework_of);
    main.appendChild(el("div", { class: "modal-label" }, "수정 대상"));
    main.appendChild(el("div", { class: "modal-meta" }, "↩ " + t.rework_of + (orig ? " — " + orig.title : " (티켓 없음)")));
  }
  const reworks = DOC.tickets.filter(x => x.rework_of === t.id);
  if (reworks.length) {
    main.appendChild(el("div", { class: "modal-label" }, "수정 이력 (" + reworks.length + ")"));
    const rw = el("div", { class: "deps" });
    reworks.forEach(x => rw.appendChild(el("span", { class: "dep-chip" }, x.id + " · " + (STATUS_KO[x.status] || x.status))));
    main.appendChild(rw);
  }

  if (t.status === "done" && t.result) {
    const r = t.result;
    main.appendChild(el("div", { class: "modal-label" }, "결과"));
    if (r.summary) main.appendChild(el("div", { class: "modal-purpose" }, r.summary));
    if (r.files_changed && r.files_changed.length) main.appendChild(el("div", { class: "modal-meta" }, "변경 파일: " + r.files_changed.join(", ")));
    if (r.followups && r.followups.length) main.appendChild(el("div", { class: "modal-meta" }, "후속 제안: " + r.followups.join(" / ")));
  }

  const origStatus = origById[t.id] ? origById[t.id].status : t.status;
  const readonly = !EDITABLE.includes(origStatus);

  if (readonly) {
    main.appendChild(el("div", { class: "readonly" }, "읽기 전용 — 실행 상태는 에이전트가 관리합니다"));
  }

  const side = el("div", { class: "modal-side" });
  renderComments(side, t, readonly);

  body.appendChild(main);
  body.appendChild(side);
  wrap.appendChild(body);

  /* 액션 버튼 — 모달 하단 전체 폭 푸터, 우측 정렬. 상태를 결정하는 주 버튼이 제일 우측 */
  if (!readonly) {
    const btns = el("div", { class: "btns" });
    if (t.status === "draft") {
      btns.appendChild(el("button", { onclick: () => { modalEditing = true; render(); } }, "편집"));
      btns.appendChild(el("button", { class: "b-reject", onclick: () => setStatus(t.id, "rejected") }, "반려"));
      btns.appendChild(el("button", { class: "b-approve", onclick: () => setStatus(t.id, "approved") }, "승인"));
    } else if (t.status === "approved") {
      btns.appendChild(el("button", { onclick: () => setStatus(t.id, "draft") }, "초안으로"));
      btns.appendChild(el("button", { onclick: () => { modalEditing = true; render(); } }, "편집"));
      btns.appendChild(el("button", { class: "b-reject", onclick: () => setStatus(t.id, "rejected") }, "반려"));
    } else if (t.status === "rejected") {
      btns.appendChild(el("button", { onclick: () => setStatus(t.id, "draft") }, "초안으로 되돌리기"));
    }
    wrap.appendChild(btns);
  }
  return wrap;
}

function renderModalEdit(t) {
  const wrap = el("div", {});
  const head = el("div", { class: "modal-head" });
  head.appendChild(el("div", { class: "id" }, t.id + " 편집"));
  head.appendChild(el("button", { class: "modal-close", onclick: closeModal }, "✕"));
  wrap.appendChild(head);

  const body = el("div", { class: "modal-body" });
  const main = el("div", { class: "modal-main" });

  const f = el("div", { class: "edit-form" });
  const inTitle = el("input", { value: t.title });
  const inPurpose = el("textarea", {}); inPurpose.value = t.purpose || "";
  const inSteps = el("textarea", {}); inSteps.value = (t.steps || []).join("\n"); inSteps.style.minHeight = "140px";
  const inPrio = el("input", { type: "number", value: t.priority, min: "1" });
  const inScope = el("textarea", {}); inScope.value = (t.scope || []).join("\n"); inScope.style.minHeight = "56px";
  const inLat = el("select", {},
    el("option", { value: "strict" }, "엄격(기본) — 단계 외 작업 금지"),
    el("option", { value: "flex" }, "유연 — 범위 안 부수 개선 허용"));
  inLat.value = t.latitude === "flex" ? "flex" : "strict";
  const inRework = el("input", { value: t.rework_of || "", placeholder: "예: T-005 — 완료 티켓의 산출물을 고치는 티켓이면" });
  const err = el("div", { class: "err" }, "steps 마지막 줄은 반드시 \"검증:\"으로 시작해야 합니다.");
  const errRework = el("div", { class: "err" }, "수정 대상 티켓 ID가 존재하지 않거나 자기 자신입니다.");
  f.appendChild(el("label", {}, "제목")); f.appendChild(inTitle);
  f.appendChild(el("label", {}, "목적")); f.appendChild(inPurpose);
  f.appendChild(el("label", {}, "단계 (한 줄에 하나 · 마지막 줄은 \"검증:\"으로 시작)")); f.appendChild(inSteps);
  f.appendChild(el("label", {}, "우선순위 (낮을수록 먼저)")); f.appendChild(inPrio);
  f.appendChild(el("label", {}, "수정 범위 scope (한 줄에 하나 · 비우면 병렬 제외)")); f.appendChild(inScope);
  f.appendChild(el("label", {}, "재량 (서브에이전트 자유도)")); f.appendChild(inLat);
  f.appendChild(el("label", {}, "수정 대상 (rework_of · 비우면 일반 티켓)")); f.appendChild(inRework);
  f.appendChild(err);
  f.appendChild(errRework);

  main.appendChild(f);

  /* 편집 모드에서도 우측 코멘트 패널 유지 (편집 진입은 편집 가능 상태에서만 가능) */
  const side = el("div", { class: "modal-side" });
  renderComments(side, t, false);

  body.appendChild(main);
  body.appendChild(side);
  wrap.appendChild(body);

  /* 저장/취소 — 하단 푸터 우측 정렬, 주 액션(저장)이 제일 우측 */
  const btns = el("div", { class: "btns" });
  btns.appendChild(el("button", { onclick: () => { modalEditing = false; render(); } }, "취소"));
  btns.appendChild(el("button", { class: "b-approve", onclick: () => {
    const steps = inSteps.value.split("\n").map(s => s.trim()).filter(Boolean);
    if (!steps.length || !steps[steps.length - 1].startsWith("검증:")) { err.style.display = "block"; return; }
    const rw = inRework.value.trim();
    if (rw && (rw === t.id || !DOC.tickets.some(x => x.id === rw))) { errRework.style.display = "block"; return; }
    t.rework_of = rw || null;
    t.title = inTitle.value.trim() || t.title;
    t.purpose = inPurpose.value.trim();
    t.steps = steps;
    t.priority = parseInt(inPrio.value, 10) || t.priority;
    t.scope = inScope.value.split("\n").map(x => x.trim()).filter(Boolean);
    t.latitude = inLat.value === "flex" ? "flex" : "strict";
    modalEditing = false;
    render();
  } }, "저장"));
  wrap.appendChild(btns);
  return wrap;
}

function renderModal() {
  const root = document.getElementById("modal-root");
  root.innerHTML = "";
  const t = openModalId ? DOC.tickets.find(x => x.id === openModalId) : null;
  if (!t) { root.style.display = "none"; return; }
  root.style.display = "flex";

  const overlay = el("div", { class: "modal-overlay" });
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  const modal = el("div", { class: "modal" });
  modal.addEventListener("click", (e) => e.stopPropagation());
  modal.appendChild(modalEditing ? renderModalEdit(t) : renderModalView(t));
  overlay.appendChild(modal);
  root.appendChild(overlay);
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && openModalId) closeModal();
});

/* ---- 리포트 탭 ----
   한 줄 요약: 원본 문자열을 표 칸에 밀어 넣지 않고, 티켓마다 항목을 나눠 읽는 순서대로 배치한다.
   사유(왜 시작됐나) → 목적(무엇을 달성하려 했나) → 한 일(실제 수행) → 효과(무엇이 가능해졌나)
   → 바뀐 파일 → 증빙 → 후속 제안. 표는 훑어보기용 "완료 목록"으로만 남긴다. */

function ymd(iso) { return iso ? String(iso).slice(0, 10) : ""; }

/* 완료 순(오래된 → 최근). 프로젝트가 어떤 순서로 진척됐는지가 그대로 읽힌다. */
function reportDoneTickets() {
  return DOC.tickets.filter(t => t.status === "done").sort((a, b) => {
    const x = (a.result || {}).completed_at || "", y = (b.result || {}).completed_at || "";
    if (x !== y) return (x && y) ? (x < y ? -1 : 1) : (x ? -1 : 1);
    return (a.priority - b.priority) || a.id.localeCompare(b.id);
  });
}

/* 상단 요약 — 무엇이 얼마나 끝났는지를 먼저 보여 주고, 세부는 아래 카드에서 읽게 한다.
   숫자 타일은 보드 컬럼(초안·승인·진행중·완료)과 같은 이름을 써서 따로 해석할 게 없게 한다. */
function renderReportHead(done) {
  const head = el("section", { class: "rp-head" });

  const top = el("div", { class: "rp-head-top" });
  const titles = el("div", {});
  titles.appendChild(el("div", { class: "rp-title" }, (DOC.project.name || "프로젝트") + " 실행 리포트"));
  if (DOC.project.goal) titles.appendChild(el("div", { class: "rp-goal" }, DOC.project.goal));
  top.appendChild(titles);
  top.appendChild(el("button", { class: "rp-print", onclick: () => window.print() }, "인쇄 · PDF"));
  head.appendChild(top);

  const countOf = statuses => DOC.tickets.filter(t => statuses.includes(t.status)).length;
  const rejected = countOf(["rejected"]);
  const tile = (cls, n, label) => {
    const d = el("div", { class: "rp-stat " + cls });
    d.appendChild(el("b", {}, String(n)));
    d.appendChild(el("span", {}, label));
    return d;
  };
  const stats = el("div", { class: "rp-stats" });
  stats.appendChild(tile("s-done", done.length, "완료"));
  stats.appendChild(tile("s-run", countOf(["in_progress", "blocked"]), "진행중"));
  stats.appendChild(tile("s-wait", countOf(["approved"]), "승인"));
  stats.appendChild(tile("s-wait", countOf(["draft"]), "초안"));
  if (rejected) stats.appendChild(tile("s-rej", rejected, "반려"));
  head.appendChild(stats);

  const live = DOC.tickets.length - rejected; // 진행률은 반려를 뺀 티켓 기준
  const pct = live > 0 ? Math.round(done.length / live * 100) : 0;
  const bar = el("div", { class: "rp-bar" });
  bar.appendChild(el("i", { style: "width:" + pct + "%" }));
  head.appendChild(bar);

  const files = new Set();
  let evCount = 0;
  done.forEach(t => {
    const r = t.result || {};
    (r.files_changed || []).forEach(f => files.add(f));
    evCount += (r.evidence || []).length;
  });
  const days = done.map(t => ymd((t.result || {}).completed_at)).filter(Boolean).sort();
  const meta = el("div", { class: "rp-meta" });
  meta.appendChild(el("span", {}, "진행률 " + pct + "% — 완료 " + done.length + " / " + live + "건"));
  if (days.length) {
    const first = days[0], last = days[days.length - 1];
    meta.appendChild(el("span", {}, "완료 기간 " + (first === last ? first : first + " ~ " + last)));
  }
  if (files.size) meta.appendChild(el("span", {}, "바뀐 파일 " + files.size + "개"));
  if (evCount) meta.appendChild(el("span", {}, "증빙 " + evCount + "건"));
  meta.appendChild(el("span", {}, "갱신 " + (DOC.updated_at ? DOC.updated_at.slice(0, 16).replace("T", " ") : "-")));
  head.appendChild(meta);
  return head;
}

/* 완료 목록 — 훑어보기용. 파일 경로 같은 긴 문자열은 개수로만 세고 본문(카드)에서 펼친다. */
function renderReportIndex(done) {
  const sec = el("section", { class: "rp-sec" });
  sec.appendChild(el("div", { class: "rp-sec-h" }, "완료 목록 " + done.length + "건 · 행을 누르면 해당 보고로 이동합니다"));
  const box = el("div", { class: "rp-index-wrap" });
  const table = el("table", { class: "rp-index" });
  const thead = el("thead", {});
  thead.appendChild(el("tr", {},
    el("th", { class: "c-id" }, "ID"), el("th", { class: "c-title" }, "제목"),
    el("th", { class: "c-date" }, "완료일"), el("th", { class: "c-num" }, "바뀐 파일"), el("th", { class: "c-num" }, "증빙")));
  table.appendChild(thead);
  const tbody = el("tbody", {});
  done.forEach(t => {
    const r = t.result || {};
    const tr = el("tr", {},
      el("td", { class: "c-id" }, t.id),
      el("td", { class: "c-title", title: t.title }, t.title),
      el("td", { class: "c-date" }, ymd(r.completed_at) || "-"),
      el("td", { class: "c-num" }, String((r.files_changed || []).length)),
      el("td", { class: "c-num" }, String((r.evidence || []).length)));
    tr.addEventListener("click", () => {

      if (!card) return;
      card.scrollIntoView({ behavior: "smooth", block: "start" });
      card.classList.add("hl");
      setTimeout(() => card.classList.remove("hl"), 1400);
    });

  });

  sec.appendChild(box);
  return sec;
}

const EV_LABEL = { screenshot: "화면", diff: "변경", file: "파일" };

/* 증빙 — 스크린샷은 캡션 붙은 갤러리로, 그 외(diff·file)는 [태그] + 설명 한 덩어리로 */
function renderReportEvidence(list) {
  const box = el("div", { class: "rp-ev" });
  const shots = list.filter(e => e.type === "screenshot" && e.path);
  const rest = list.filter(e => !(e.type === "screenshot" && e.path));
  if (shots.length) {
    const gallery = el("div", { class: "rp-shots" });
    shots.forEach(e => {
      const fig = el("figure", { class: "rp-shot" });
      const a = el("a", { href: e.path, target: "_blank", title: e.note || e.path });
      a.appendChild(el("img", { src: e.path, alt: e.note || e.path }));
      fig.appendChild(a);
      fig.appendChild(el("figcaption", {}, e.note || e.path));
      gallery.appendChild(fig);
    });
    box.appendChild(gallery);
  }
  rest.forEach(e => {
    const row = el("div", { class: "rp-ev-row" });
    row.appendChild(el("span", { class: "rp-tag t-" + (e.type || "file") }, EV_LABEL[e.type] || e.type || "증빙"));
    const body = el("div", {});
    body.appendChild(el("div", { class: "rp-ev-note" }, e.note || "(설명 없음)"));
    if (e.path) body.appendChild(el("div", { class: "rp-ev-path" }, e.path));
    row.appendChild(body);
    box.appendChild(row);
  });
  return box;
}

function renderReportCard(t) {
  const r = t.result || {};
  const card = el("article", { class: "rp-card", id: "rp-" + t.id });

  const head = el("div", { class: "rp-card-head" }, t.id);
  head.appendChild(el("span", { class: "badge b-prio" }, "P" + t.priority));
  if (t.origin === "suggested") head.appendChild(el("span", { class: "badge b-suggested" }, "제안"));
  if (t.latitude === "flex") head.appendChild(el("span", { class: "badge b-flex" }, "재량"));
  if (t.rework_of) head.appendChild(el("span", { class: "badge b-rework" }, "↩ " + t.rework_of));
  head.appendChild(el("span", { class: "rp-card-date" }, r.completed_at ? ymd(r.completed_at) + " 완료" : "완료일 미기록"));
  card.appendChild(head);
  card.appendChild(el("h3", { class: "rp-card-title" }, t.title));

  /* purpose가 사유/목적/효과 컨벤션이면 갈라서 배치한다. 아니면 원문 한 덩어리 (구형 티켓 하위 호환) */
  const p = parsePurpose(t.purpose);
  if (p) {
    card.appendChild(el("div", { class: "rp-k" }, "사유"));
    card.appendChild(el("div", { class: "rp-v" }, p["사유"]));
    card.appendChild(el("div", { class: "rp-k" }, "목적"));
    card.appendChild(el("div", { class: "rp-v lead" }, p["목적"]));
  } else if (t.purpose) {
    card.appendChild(el("div", { class: "rp-k" }, "목적"));
    card.appendChild(el("div", { class: "rp-v" }, t.purpose));
  }

  card.appendChild(el("div", { class: "rp-k" }, "한 일"));
  card.appendChild(r.summary
    ? el("div", { class: "rp-v" }, r.summary)
    : el("div", { class: "rp-note" }, "수행 요약이 기록되지 않았습니다."));

  /* 효과는 "한 일" 뒤에 둔다 — 무엇을 했는지 읽은 다음에 무엇이 가능해졌는지가 이어져야 말이 된다 */
  if (p) {
    card.appendChild(el("div", { class: "rp-k" }, "효과"));
    card.appendChild(el("div", { class: "rp-v" }, p["효과"]));
  }

  const files = r.files_changed || [];
  card.appendChild(el("div", { class: "rp-k" }, "바뀐 파일" + (files.length ? " (" + files.length + ")" : "")));
  if (files.length) {
    const list = el("div", { class: "rp-files" });
    files.forEach(f => list.appendChild(el("code", { class: "rp-path" }, f)));
    card.appendChild(list);
  } else {
    card.appendChild(el("div", { class: "rp-note" }, "기록된 변경 파일이 없습니다."));
  }

  const evidence = r.evidence || [];
  if (evidence.length) {
    card.appendChild(el("div", { class: "rp-k" }, "증빙 (" + evidence.length + ")"));
    card.appendChild(renderReportEvidence(evidence));
  }

  const followups = r.followups || [];
  if (followups.length) {
    card.appendChild(el("div", { class: "rp-k" }, "후속 제안 (" + followups.length + ")"));
    const ul = el("ul", { class: "rp-list" });
    followups.forEach(x => ul.appendChild(el("li", {}, x)));
    card.appendChild(ul);
  }

  /* 이 티켓을 고친 수정 티켓이 있으면 결과가 그 뒤로 바뀌었다는 뜻이라 함께 보여 준다 */
  const reworks = DOC.tickets.filter(x => x.rework_of === t.id);
  if (reworks.length) {
    card.appendChild(el("div", { class: "rp-k" }, "이후 수정 (" + reworks.length + ")"));
    const chips = el("div", { class: "rp-files" });
    reworks.forEach(x => chips.appendChild(el("span", { class: "rp-chip" }, x.id + " · " + x.title + " · " + (STATUS_KO[x.status] || x.status))));
    card.appendChild(chips);
  }
  return card;
}

function renderReport() {
  const wrap = document.getElementById("report");
  wrap.innerHTML = "";

}

  }
});

/* ---- tickets.json 직접 연결 (크로미움 File System Access API) ----
   최초 1회 [tickets.json 연결]로 파일을 선택하면 핸들을 IndexedDB에 보관한다.
   이후에는 보드를 열 때 연결된 파일을 먼저 읽어 저장된 상태를 그대로 보여주고
   (권한이 'prompt'면 1클릭 배너), [저장]이 tickets.json을 직접 덮어쓴다.
   사파리·파이어폭스는 API가 없어 이 절이 통째로 비활성화된다(클립보드 경로만). */
const FSA = "showOpenFilePicker" in window;
const IDB_KEY = "tp-handle::" + location.pathname; // 프로젝트(보드 경로)별로 핸들을 구분
let fileHandle = null;
let fileLoadedAt = null; // 마지막으로 파일에서 읽은 updated_at — 저장 전 충돌 감지용

function idbOpen() {
  return new Promise((resolve, reject) => {
    const rq = indexedDB.open("ticket-pilot", 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore("kv");
    rq.onsuccess = () => resolve(rq.result);
    rq.onerror = () => reject(rq.error);
  });
}
async function idbGet(key) {
  try {
    const db = await idbOpen();
    return await new Promise((resolve, reject) => {
      const rq = db.transaction("kv").objectStore("kv").get(key);
      rq.onsuccess = () => resolve(rq.result);
      rq.onerror = () => reject(rq.error);
    });
  } catch (e) { return undefined; }
}
async function idbSet(key, val) {
  try {
    const db = await idbOpen();
    await new Promise((resolve, reject) => {
      const tx = db.transaction("kv", "readwrite");
      tx.objectStore("kv").put(val, key);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { /* IndexedDB 불가 환경 — 세션 내 연결만 유지된다 */ }
}
async function idbDel(key) {
  try {
    const db = await idbOpen();
    await new Promise((resolve, reject) => {
      const tx = db.transaction("kv", "readwrite");
      tx.objectStore("kv").delete(key);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { /* 무시 */ }
}

function updateConnUI() {
  const conn = document.getElementById("conn-status");
  const bc = document.getElementById("btn-connect");
  const bs = document.getElementById("btn-save");
  if (!FSA) { conn.textContent = ""; bc.style.display = "none"; bs.style.display = "none"; return; }
  if (fileHandle) {
    bc.style.display = "none";
    bs.style.display = "inline-block";
    const n = DOC.tickets.filter(isChanged).length;
    bs.textContent = n ? "저장 (변경 " + n + "건)" : "저장";
    conn.textContent = "🔗 " + (fileHandle.name || "tickets.json");
  } else {
    bc.style.display = "inline-block";
    bs.style.display = "none";
    conn.textContent = "";
  }
}

async function loadFromFile(silent) {
  if (!fileHandle) return false;
  try {
    const f = await fileHandle.getFile();
    const doc = normalizeDoc(JSON.parse(await f.text()));
    DOC = doc;
    rebuildBaseline();
    fileLoadedAt = DOC.updated_at || "";
    openModalId = null; modalEditing = false;
    render();
    if (!silent) showMsg("✅ 연결된 tickets.json에서 최신 상태를 불러왔습니다 (갱신: " + (DOC.updated_at || "-") + ").");
    return true;
  } catch (e) {
    if (e && e.name === "NotAllowedError") { showPermissionBanner(); return false; }
    if (e && e.name === "NotFoundError") {
      fileHandle = null;
      await idbDel(IDB_KEY);
      updateConnUI();
      showMsg("연결했던 tickets.json을 찾을 수 없습니다(이동·삭제됨). [tickets.json 연결]로 다시 연결하세요.");
      return false;
    }
    showMsg("tickets.json을 읽지 못했습니다: " + (e && e.message ? e.message : e) + " — 임베드된 데이터로 표시 중입니다.");
    return false;
  }
}

function showPermissionBanner() {
  const wrap = el("div", {},
    el("div", {}, "🔗 이 보드에 연결된 tickets.json이 있습니다. 저장된 최신 상태를 불러오려면 권한을 허용하세요. (크롬 122+는 프롬프트에서 \"모든 방문에서 허용\"을 선택하면 다음부터 자동으로 불러옵니다)"));
  const btns = el("div", { class: "msg-btns" });
  btns.appendChild(el("button", { class: "primary", onclick: async () => {
    try {
      const perm = await fileHandle.requestPermission({ mode: "readwrite" });
      if (perm === "granted") await loadFromFile(false);
      else showMsg("권한이 거부되었습니다. 임베드된 데이터로 표시하며, 저장은 [프롬프트 복사(코워크)] 경로를 사용하세요.");
    } catch (e) { showMsg("권한 요청 실패: " + e.message); }
  } }, "연결된 tickets.json 불러오기"));
  btns.appendChild(el("button", { onclick: async () => {
    fileHandle = null;
    await idbDel(IDB_KEY);
    updateConnUI();
    document.getElementById("apply-msg").style.display = "none";
  } }, "연결 해제"));
  wrap.appendChild(btns);
  showMsg(wrap);
}

async function connectFile() {
  try {
    const [h] = await window.showOpenFilePicker({
      types: [{ description: "tickets.json", accept: { "application/json": [".json"] } }],
      multiple: false,
    });
    fileHandle = h;
    await idbSet(IDB_KEY, h);
    const ok = await loadFromFile(true);
    updateConnUI();
    if (ok) showMsg("✅ tickets.json에 연결되었습니다. 이제 [저장]을 누르면 변경이 파일에 바로 저장되고, 보드를 다시 열 때도 이 파일을 먼저 읽습니다.");
  } catch (e) {
    if (e && e.name !== "AbortError") showMsg("연결 실패: " + e.message);
  }
}

function stampChanges() {
  const ts = nowISO();
  DOC.tickets.forEach(t => { if (isChanged(t)) t.updated_at = ts; });
  DOC.updated_at = ts;
}

async function saveToFile(force) {
  if (!fileHandle) return;
  try {
    let perm = "prompt";
    try { perm = await fileHandle.queryPermission({ mode: "readwrite" }); } catch (e) { /* 미지원 시 request로 진행 */ }
    if (perm !== "granted") perm = await fileHandle.requestPermission({ mode: "readwrite" });
    if (perm !== "granted") { showMsg("쓰기 권한이 거부되었습니다 — [프롬프트 복사(코워크)] 경로를 사용하세요."); return; }

    if (!force) {
      /* 보드를 연 뒤 파일이 다른 곳(에이전트 실행 등)에서 바뀌었으면 덮어쓰기 전에 선택을 받는다 */
      try {
        const cur = JSON.parse(await (await fileHandle.getFile()).text());
        if ((cur.updated_at || "") !== (fileLoadedAt || "")) { showConflict(); return; }
      } catch (e) { /* 비교 실패 시 충돌 검사 생략 */ }
    }

    stampChanges();
    const w = await fileHandle.createWritable();
    await w.write(payload());
    await w.close();
    fileLoadedAt = DOC.updated_at;
    rebuildBaseline();
    render();
    showMsg("✅ tickets.json에 저장했습니다 (갱신: " + DOC.updated_at + "). 보드를 다시 열어도 이 상태가 유지되고, 클로드는 tickets.json을 읽어 바로 작업합니다.");
  } catch (e) {
    if (e && e.name !== "AbortError") showMsg("저장 실패: " + (e && e.message ? e.message : e) + " — [프롬프트 복사(코워크)] 경로를 사용하세요.");
  }
}

function showConflict() {
  const wrap = el("div", {},
    el("div", {}, "⚠️ 보드를 연 뒤 tickets.json이 다른 곳(에이전트 실행·다른 세션)에서 변경되었습니다. 어느 쪽을 남길지 선택하세요."));
  const btns = el("div", { class: "msg-btns" });
  btns.appendChild(el("button", { class: "primary", onclick: () => loadFromFile(false) }, "파일 다시 불러오기 (보드의 미저장 변경은 사라짐)"));
  btns.appendChild(el("button", { onclick: () => saveToFile(true) }, "그래도 저장 (파일의 새 변경을 덮어씀)"));
  wrap.appendChild(btns);
  showMsg(wrap);
}

async function initFileConnection() {
  if (!FSA) return;
  updateConnUI();
  const saved = await idbGet(IDB_KEY);
  if (!saved) return;
  fileHandle = saved;
  updateConnUI();
  let perm = "prompt";
  try { perm = await fileHandle.queryPermission({ mode: "readwrite" }); } catch (e) { /* 구버전 — 배너 경로로 */ }
  if (perm === "granted") await loadFromFile(true);
  else showPermissionBanner();
}

document.getElementById("btn-connect").addEventListener("click", connectFile);
document.getElementById("btn-save").addEventListener("click", () => saveToFile(false));

window.addEventListener("beforeunload", (e) => {
  if (fileHandle && DOC.tickets.some(isChanged)) { e.preventDefault(); e.returnValue = ""; }
});

/* ---- 탭 ---- */
document.getElementById("tab-board").addEventListener("click", () => {
  document.getElementById("board").style.display = "grid";
  document.getElementById("report").style.display = "none";
  document.getElementById("tab-board").classList.add("active");
  document.getElementById("tab-report").classList.remove("active");
});
document.getElementById("tab-report").addEventListener("click", () => {
  document.getElementById("board").style.display = "none";
  document.getElementById("report").style.display = "block";
  document.getElementById("tab-report").classList.add("active");
  document.getElementById("tab-board").classList.remove("active");
});

render();
initFileConnection();

</script>
</body>
</html>
